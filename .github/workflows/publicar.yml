name: Publicar Shorts no YouTube

on:
  push:
    branches: [main]
    paths: ['publicar/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-auth-oauthlib google-api-python-client
      - name: Enviar cada vídeo da pasta publicar/
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && ! ls publicar/*.json >/dev/null 2>&1; then python3 yt.py ptmap painel/pt_map.json && git add painel/pt_map.json && git -c user.name=publicador-vcd -c user.email=actions@users.noreply.github.com commit -qm "Mapa PT atualizado" && git push; exit 0; fi
          enviados=0
          for meta in publicar/*.json; do
            video="${meta%.json}.mp4"
            if [ -f "$video" ]; then
              echo "Enviando $video"
              python3 yt.py up "$video" "$meta"
              bash tiktok_release.sh "$video" "$meta" "gta_$(basename "${meta%.json}")"   # cópia pro TikTok (app Meus Canais)
              git rm -q "$video" "$meta"; [ -f "${meta%.json}.jpg" ] && git rm -q "${meta%.json}.jpg"
              enviados=$((enviados+1))
            fi
          done
          if [ "$enviados" -gt 0 ]; then
            python3 yt.py ptmap painel/pt_map.json && git add painel/pt_map.json || echo "AVISO: mapa PT não atualizado"
            git config user.name "publicador-vcd"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Publicados $enviados video(s) no YouTube"
            git push
          fi
