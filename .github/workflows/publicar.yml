name: Publicar Shorts no YouTube

on:
  push:
    branches: [main]
    paths: ['publicar/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-auth-oauthlib google-api-python-client
      - name: Enviar cada vídeo da pasta publicar/
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          shopt -s nullglob
          enviados=0
          for meta in publicar/*.json; do
            video="${meta%.json}.mp4"
            if [ -f "$video" ]; then
              echo "Enviando $video"
              python3 yt.py up "$video" "$meta"
              git rm -q "$video" "$meta"
              enviados=$((enviados+1))
            fi
          done
          if [ "$enviados" -gt 0 ]; then
            git config user.name "publicador-vcd"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Publicados $enviados video(s) no YouTube"
            git push
          fi
