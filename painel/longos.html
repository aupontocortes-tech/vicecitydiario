<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#120a1f" />
  <meta name="description" content="Vídeos longos para publicar" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.jpg" type="image/jpeg" />
  <title>Vídeos longos — Painel</title>
  <style>
    :root {
      --bg: #120a1f; --bg-card: #24183a; --rosa: #ff3c96; --ciano: #28e6dc; --amarelo: #ffde28;
      --texto: #f3eef8; --texto-suave: #b9aec9; --borda: rgba(255,255,255,0.08); --raio: 16px;
      --cor-canal: #ff3c96; --cor-canal-texto: #fff;
      --fonte: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: var(--bg); color: var(--texto); font-family: var(--fonte); font-size: 17px; line-height: 1.55; }
    body { background: radial-gradient(ellipse 80% 50% at 10% -10%, color-mix(in srgb, var(--cor-canal) 18%, transparent), transparent 55%), var(--bg); }
    a { color: var(--ciano); text-decoration: none; }
    .wrap { width: min(100%, 620px); margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right)) 56px max(16px, env(safe-area-inset-left)); }
    .seletor-canal { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
    .seletor-canal::-webkit-scrollbar { display: none; }
    .btn-canal { flex: 1 0 96px; min-height: 44px; padding: 8px 10px; border-radius: 999px; border: 1px solid var(--borda); background: transparent; color: var(--texto-suave); font: inherit; font-size: .92rem; font-weight: 700; white-space: nowrap; cursor: pointer; }
    .btn-canal[aria-pressed="true"] { background: var(--cor-canal); color: var(--cor-canal-texto); border-color: transparent; }
    h1 { font-size: 1.45rem; color: var(--cor-canal); }
    .sub { color: var(--texto-suave); font-size: .92rem; margin: 2px 0 18px; }
    .voltar { display: inline-block; margin-bottom: 14px; font-weight: 600; }
    .lista { display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--bg-card); border: 1px solid var(--borda); border-radius: var(--raio); padding: 14px 16px; }
    .card.proximo { border-color: var(--cor-canal); box-shadow: 0 0 22px color-mix(in srgb, var(--cor-canal) 18%, transparent); }
    .tag { display: inline-block; font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.08); color: var(--texto-suave); margin-bottom: 6px; }
    .card.proximo .tag { background: var(--cor-canal); color: var(--cor-canal-texto); }
    .tit { font-size: 1.08rem; font-weight: 800; line-height: 1.3; }
    .tit-pt { color: var(--amarelo); font-weight: 700; margin-top: 2px; }
    .resumo { color: var(--texto-suave); margin-top: 8px; font-size: .95rem; }
    .meta { color: var(--texto-suave); font-size: .8rem; margin-top: 6px; }
    details { margin-top: 10px; }
    summary { cursor: pointer; font-weight: 700; color: var(--ciano); list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: "▸ "; }
    details[open] summary::before { content: "▾ "; }
    ol { margin: 10px 0 0 22px; display: flex; flex-direction: column; gap: 8px; }
    li { font-size: .95rem; }
    li .en { display: block; color: var(--texto-suave); font-size: .82rem; font-style: italic; margin-top: 2px; }
    .ouvir { margin-top: 12px; width: 100%; min-height: 46px; border-radius: 12px; border: 0; background: var(--cor-canal); color: var(--cor-canal-texto); font: inherit; font-weight: 800; cursor: pointer; }
    .ouvir[aria-pressed="true"] { background: rgba(255,255,255,.12); color: var(--texto); }
    li .voz { font-size: .72rem; font-weight: 800; color: var(--amarelo); text-transform: uppercase; margin-right: 6px; }
    .assistir { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .assistir a { flex: 1 1 140px; min-height: 44px; padding: 8px 12px; text-align: center; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-weight: 800; background: rgba(255,255,255,.08); color: var(--texto); }
    .assistir a.pt { background: var(--cor-canal); color: var(--cor-canal-texto); }
    .texto-pt p { margin: 8px 0; font-size: .95rem; }
    .links { display: flex; gap: 8px; flex-wrap: wrap; }
    .assistir.pt { background: var(--cor-canal); color: var(--cor-canal-texto); }
    h2 { font-size: 1.15rem; margin: 28px 0 10px; color: var(--cor-canal); }
    .vazio, .erro { color: var(--texto-suave); text-align: center; padding: 28px 10px; border: 1px dashed var(--borda); border-radius: var(--raio); }
    button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--amarelo); outline-offset: 2px; }
  
    .produzir { margin-top: 12px; width: 100%; min-height: 48px; border-radius: 12px; border: 0; background: var(--cor-canal); color: var(--cor-canal-texto); font: inherit; font-weight: 800; cursor: pointer; }
    .produzir[disabled] { opacity: .5; cursor: default; }
    .assistir { display: inline-flex; margin-top: 10px; min-height: 44px; align-items: center; padding: 0 16px; border-radius: 12px; background: rgba(255,255,255,.08); color: var(--texto); font-weight: 800; }
    .senha { display: flex; gap: 8px; margin: 0 0 16px; }
    .senha input { flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid var(--borda); background: var(--bg-card); color: var(--texto); padding: 0 12px; font: inherit; }
    .aviso { margin-top: 10px; font-size: .9rem; color: var(--amarelo); }
    .texto-pt p { margin: 8px 0; font-size: .95rem; }
    .links { display: flex; gap: 8px; flex-wrap: wrap; }
    .assistir.pt { background: var(--cor-canal); color: var(--cor-canal-texto); }
    h2 { font-size: 1.15rem; margin: 26px 0 10px; color: var(--cor-canal); }

  </style>
</head>
<body>
  <main class="wrap">
    <div class="seletor-canal" id="seletor-canal" role="group" aria-label="Canal"></div>
    <a class="voltar" id="link-painel" href="/">← Voltar ao painel</a>
    <h1 id="titulo">Vídeos longos</h1>
    <p class="sub">Vídeos deitados de 10 minutos a 1 hora. Eles não entram na fila diária: só saem quando você apertar o botão.</p>
    <div class="senha"><input type="password" id="senha" placeholder="Senha do painel" autocomplete="current-password" /></div>
    <div class="lista" id="fila"><div class="vazio">Carregando…</div></div>
    <section id="sec-pub" hidden><h2>Já publicados</h2><div class="lista" id="pub"></div></section>
  </main>
  <script src="/canais-ui.js"></script>
  <script>
    const CHAVE_CANAL = 'painel_canal', CHAVE_SENHA = 'vcd_painel_senha';
    function canalAtual() {
      const q = new URLSearchParams(location.search).get('canal');
      if (CANAIS_LISTA.some((c) => c.id === q)) return q;
      try { const c = localStorage.getItem(CHAVE_CANAL); if (CANAIS_LISTA.some((x) => x.id === c)) return c; } catch {}
      return 'vf';
    }
    function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
    try { document.getElementById('senha').value = localStorage.getItem(CHAVE_SENHA) || ''; } catch {}

    function cartao(r) {
      return `<article class="card">
        <div class="tit">${esc(r.titulo)}</div>
        ${r.tituloPt ? `<div class="tit-pt">${esc(r.tituloPt)}</div>` : ''}
        ${r.resumoPt ? `<p class="resumo">${esc(r.resumoPt)}</p>` : ''}
        <div class="meta">~${r.minutos || '?'} min · ${r.partes || 0} imagens</div>
        ${r.textoPt && r.textoPt.length ? `<details><summary>Ler a história em português</summary><div class="texto-pt">${r.textoPt.map((t) => `<p>${esc(t)}</p>`).join('')}</div></details>` : ''}
        <button type="button" class="produzir" data-arq="${esc(r.arquivo)}">▶ Produzir e publicar agora</button>
        <div class="aviso" hidden></div>
      </article>`;
    }
    function cartaoPub(r) {
      return `<article class="card"><div class="tit">${esc(r.titulo)}</div>
        ${r.tituloPt ? `<div class="tit-pt">${esc(r.tituloPt)}</div>` : ''}
        <div class="links">
          ${r.videoIdPt ? `<a class="assistir pt" href="https://www.youtube.com/watch?v=${encodeURIComponent(r.videoIdPt)}" target="_blank" rel="noopener">🇧🇷 Ver em português</a>` : ''}
          ${r.videoId ? `<a class="assistir" href="https://www.youtube.com/watch?v=${encodeURIComponent(r.videoId)}" target="_blank" rel="noopener">▶ No canal</a>` : ''}
        </div></article>`;
    }
    async function carregar() {
      const id = canalAtual(); const ui = CANAIS_LISTA.find((c) => c.id === id) || CANAIS_LISTA[0];
      aplicarTemaCanal(ui); montarSeletorCanais(document.getElementById('seletor-canal'), ui.id);
      document.getElementById('titulo').textContent = `Vídeos longos · ${ui.nome}`;
      document.getElementById('link-painel').href = `/?canal=${ui.id}`;
      const fila = document.getElementById('fila'); fila.innerHTML = '<div class="vazio">Carregando…</div>';
      document.getElementById('sec-pub').hidden = true;
      try {
        const r = await fetch(`/api/longos?canal=${encodeURIComponent(ui.id)}`); const d = await r.json();
        if (!r.ok) throw new Error(d.erro);
        if (d.semLongos) { fila.innerHTML = '<div class="vazio">Este canal ainda não tem vídeos longos.</div>'; return; }
        fila.innerHTML = d.fila.length ? d.fila.map(cartao).join('') : '<div class="vazio">Nenhum vídeo longo esperando. Mande um roteiro pro Claude.</div>';
        if (d.publicados.length) { document.getElementById('pub').innerHTML = d.publicados.map(cartaoPub).join(''); document.getElementById('sec-pub').hidden = false; }
      } catch { fila.innerHTML = '<div class="erro">Não consegui carregar agora. Tente de novo.</div>'; }
    }
    document.getElementById('fila').addEventListener('click', async (ev) => {
      const b = ev.target.closest('[data-arq]'); if (!b) return;
      const aviso = b.nextElementSibling; const senha = document.getElementById('senha').value.trim();
      if (!senha) { aviso.hidden = false; aviso.textContent = 'Digite a senha do painel ali em cima.'; return; }
      b.disabled = true; aviso.hidden = false; aviso.textContent = 'Enviando…';
      try {
        const r = await fetch(`/api/longos?canal=${encodeURIComponent(canalAtual())}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ senha, arquivo: b.dataset.arq }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.erro || 'erro');
        try { localStorage.setItem(CHAVE_SENHA, senha); } catch {}
        aviso.textContent = '✅ ' + d.mensagem;
      } catch (e) { aviso.textContent = '❌ ' + e.message; b.disabled = false; }
    });
    document.getElementById('seletor-canal').addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-canal]'); if (!b) return;
      try { localStorage.setItem(CHAVE_CANAL, b.dataset.canal); } catch {}
      history.replaceState(null, '', `?canal=${b.dataset.canal}`); carregar();
    });
    carregar();
  </script>
</body>
</html>
